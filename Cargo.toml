[package]
name = "rascii_art"
version = "0.4.5"
authors = [ "UTFeight", "RGBCube" ]
description = "Advanced ASCII Art Generator"
repository = "https://github.com/UTFeight/RASCII"
keywords = [ "ascii" ]
license = "MIT"
edition = "2021"

[features]
default = ["terminal"]
cli = ["dep:clap", "dep:unicode-segmentation"]
terminal = ["dep:crossterm"]
camera = ["dep:nokhwa", "terminal"]

[dependencies]
owo-colors = "4.3"
clap = { version = "4.5.31", features = ["derive"], optional = true }
crossterm = { version = "0.28", optional = true }
image = "0.25.5"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
unicode-segmentation = { version = "1.12.0", optional = true }

[[bin]]
name = "rascii"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
strip = true
