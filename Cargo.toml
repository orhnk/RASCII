[package]
name = "rascii_art"
version = "0.4.5"
authors = [ "UTFeight", "RGBCube" ]
description = "Advanced ASCII Art Generator"
repository = "https://github.com/UTFeight/RASCII"
keywords = [ "ascii" ]
license = "MIT"
edition = "2021"

[features]
default = ["camera"]
terminal = ["dep:crossterm"]
camera = ["dep:nokhwa", "terminal"]

[dependencies]
ansi_term = "0.12.1"
clap = { version = "4.5.31", features = ["derive"] }
crossterm = { version = "0.28", optional = true }
image = "0.25.5"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
unicode-segmentation = "1.12.0"

[[bin]]
name = "rascii"
path = "src/main.rs"

[profile.release]
strip = true
